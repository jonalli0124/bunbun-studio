; Freenove ESP32-S3 CYD (FNK0104AB) — the board bunbun runs on.
;
; This is the repo's own extension point (`extra_configs = user_platformio.ini` in
; platformio.ini), so the upstream tree stays unmodified and a `git pull` will not conflict.
;
; Mirrors [env:esp32s3] and appends our board's pin overrides as a third defaults layer, so the
; generic S3 configuration is inherited and only the differences live in our file.
;
;   pio run -e freenove-s3 -t upload --upload-port COM24

[env:freenove-s3]
platform = platformio/espressif32 @ ^6.12.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = components/boards/partitions.csv
board_upload.flash_size = 16MB
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.defaults.freenove-s3"
    ; Arduino declares esp_insights / rainmaker as dependencies, so they are fetched and built
    ; even with their Arduino libraries deselected. esp_insights embeds a certificate via
    ; target_add_binary_data, and PlatformIO mangles that path (it emits
    ; .pio/build/<env>/.pio/build/<env>/https_server.crt.S) so the build dies on a file that is
    ; actually present. None of it is wanted on a virtual pet, so it is excluded outright.
    ; The three below were not enough: esp_insights itself was excluded, but its FRIENDS were not,
    ; and one of them still referenced the certificate target esp_insights would have generated -
    ; so the build died on .pio/.../https_server.crt.S, a file nothing was left to produce. The
    ; whole rainmaker/insights/diagnostics family goes, since none of it is wanted on a pet.
    "-DEXCLUDE_COMPONENTS=espressif__esp_insights;espressif__esp_rainmaker;espressif__esp_diagnostics;espressif__esp_diag_data_store;espressif__rmaker_common;espressif__rmaker_cmd_resp;espressif__rmaker_common_events;espressif__rmaker_system_ctrl;espressif__rmaker_time_sync;espressif__rmaker_console;espressif__rmaker_work_queue;espressif__esp_schedule;espressif__esp_secure_cert_mgr;espressif__network_provisioning"
